<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Login</title>
		<link rel="stylesheet" type="text/css" href="style.css">
		<script type="text/javascript" src="login.js"></script>
	</head>
	<body>
		<nav style="max-width: 480px; margin: 16px auto 0 auto; padding: 10px 16px; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; font-family: sans-serif;">
			<a href="../../index.html" style="color: #2563eb; text-decoration: none; font-weight: 600; font-size: 13px;">&larr; กลับสู่หน้า Portfolio (index.html)</a>
			<span style="font-size: 12px; color: #64748b;">MDT312 Login</span>
		</nav>
		<form name="myLogin" id="myLogin" novalidate>
			<fieldset>
				<legend>Login</legend>
				
				<div class="form-group">
					<label>Username:</label>
					<input type="text" name="username" id="username">
				</div>
				
				<div class="form-group">
					<label>Password:</label>
					<input type="password" name="password">
				</div>
				
				<div class="btn-group">
					<input type="submit" value="Login" id="loginBtn">
					<input type="reset" value="Clear" id="clearBtn">
				</div>

				<div class="switch-page">
					ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียน (Register)</a>
				</div>
			</fieldset>
		</form>
	</body>
</html>
