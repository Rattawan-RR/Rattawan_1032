<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Square game</title>
	<link rel="icon" href="data:,">
	<script src="game.js"></script>
	<link rel="stylesheet" type="text/css" href="game.css">
</head>

<body>
	<nav style="padding: 10px 16px; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; margin-bottom: 14px;">

		<span style="font-size: 12px; color: #64748b;">MDT312 Square Game</span>

	<!-- these codes were adapted from https://courses.cs.washington.edu/courses/cse154/17sp/lecture/more-dom/code/squares.html  -->

	<fieldset>
		<legend>Control</legend>
		<label for="numbox">Number of box: </label>
		<input type="text" name="numbox" id="numbox" placeholder="e.g. 10">
		<select name="color" id="color">
			<option value="maroon">Maroon</option>
			<option value="lightgreen">Lightgreen</option>
			<option value="magenta">Magenta</option>
		</select>
		<button type="button" id="start">Start</button>
		<div id="message">Ready</div>
		<div id="timerClock"> Timer:
			<div id="clock"></div>
		</div>
	</fieldset>

	<div id="container">
		<div id="layer"></div>
	</div>
</body>
